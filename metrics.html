<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliate Dashboard — TeleCRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #0f172a;
    }

    /* ── Topbar ── */
    .topbar {
      background: #0f172a;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #38bdf8; }
    .back { font-size: 13px; color: #94a3b8; text-decoration: none; }
    .back:hover { color: #ffffff; }

    /* ── Page wrapper ── */
    .page { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }

    /* ── Profile header ── */
    .profile {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .avatar {
      width: 54px; height: 54px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .profile-info h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
    .profile-info .sub { color: #64748b; font-size: 13px; margin-top: 4px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .badge-green  { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-blue   { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-amber  { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-gray   { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 0 0 12px 2px;
    }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px 22px;
    }
    .stat-card .sc-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .stat-card .sc-value { font-size: 24px; font-weight: 700; line-height: 1; }
    .stat-card .sc-sub   { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    .sc-green  .sc-value { color: #16a34a; }
    .sc-amber  .sc-value { color: #d97706; }
    .sc-blue   .sc-value { color: #2563eb; }

    /* ── White content card ── */
    .content-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 0;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .content-card-header {
      padding: 16px 22px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content-card-title { font-size: 14px; font-weight: 700; color: #0f172a; }

    /* ── Lead funnel ── */
    .funnel-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 22px;
      border-bottom: 1px solid #f8fafc;
      cursor: pointer;
      transition: background 0.12s;
    }
    .funnel-row:last-child { border-bottom: none; }
    .funnel-row:hover { background: #f8fafc; }
    .funnel-label { font-size: 13px; color: #374151; width: 150px; flex-shrink: 0; }
    .funnel-bar-wrap {
      flex: 1;
      height: 7px;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
    }
    .funnel-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .funnel-count {
      font-size: 14px;
      font-weight: 700;
      width: 50px;
      text-align: right;
      flex-shrink: 0;
    }
    .funnel-arrow { font-size: 12px; color: #cbd5e1; flex-shrink: 0; }

    /* ── Tenure row ── */
    .tenure-row {
      display: flex;
      gap: 0;
      flex-wrap: wrap;
    }
    .tenure-item {
      flex: 1;
      min-width: 160px;
      padding: 18px 22px;
      border-right: 1px solid #f1f5f9;
    }
    .tenure-item:last-child { border-right: none; }
    .t-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .t-value { font-size: 15px; font-weight: 700; color: #0f172a; }
    .t-sub   { font-size: 12px; color: #94a3b8; margin-top: 3px; }

    /* ── Bank fields ── */
    .bank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0;
    }
    .bank-field {
      padding: 16px 22px;
      border-right: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
    }
    .bank-field:nth-child(2n) { border-right: none; }
    .bank-field:nth-last-child(-n+2) { border-bottom: none; }
    .bf-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .bf-value { font-size: 14px; font-weight: 500; color: #1e293b; }
    .bf-value.empty { color: #cbd5e1; font-style: italic; }

    .update-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 7px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* ── Monthly commission table ── */
    .comm-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 22px;
      border-bottom: 1px solid #f8fafc;
      font-size: 13px;
    }
    .comm-row:last-child { border-bottom: none; }
    .comm-row.total { background: #f8fafc; font-weight: 700; }
    .comm-month  { color: #374151; }
    .comm-amount { font-weight: 700; color: #16a34a; }
    .comm-row.total .comm-amount { color: #0f172a; }
    .comm-empty { padding: 24px 22px; text-align: center; color: #94a3b8; font-size: 13px; }

    /* ── Drawer ── */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .drawer-overlay.open { display: block; }

    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #ffffff;
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 40px rgba(15,23,42,0.12);
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
      background: #fff;
    }
    .drawer-title { font-size: 16px; font-weight: 700; color: #0f172a; }
    .drawer-sub   { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .drawer-close {
      background: #f1f5f9;
      border: none;
      color: #64748b;
      font-size: 16px;
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-close:hover { background: #e2e8f0; color: #0f172a; }

    .drawer-body { flex: 1; overflow-y: auto; background: #fff; }

    .lead-row { border-bottom: 1px solid #f8fafc; }
    .lead-row:last-child { border-bottom: none; }
    .lead-item {
      display: flex;
      align-items: center;
      padding: 13px 22px;
      gap: 12px;
      cursor: pointer;
    }
    .lead-item:hover { background: #f8fafc; }
    .lead-main { flex: 1; min-width: 0; }
    .lead-name  { font-size: 14px; font-weight: 600; color: #0f172a; }
    .lead-email { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .lead-chevron {
      flex-shrink: 0;
      width: 16px;
      font-size: 12px;
      color: #cbd5e1;
      transition: transform 0.15s ease;
    }
    .lead-row.expanded .lead-chevron { transform: rotate(90deg); color: #2563eb; }

    /* ── Lead payment detail (expand panel) ── */
    .lead-expand { display: none; padding: 2px 22px 16px 50px; background: #f8fafc; }
    .lead-row.expanded .lead-expand { display: block; }
    .payment-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 8px;
    }
    .payment-date {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .payment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
    .pg-label { display: block; font-size: 10px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .pg-value { display: block; font-size: 13px; font-weight: 700; color: #0f172a; }
    .payment-empty, .payment-loading { font-size: 12px; color: #94a3b8; padding: 10px 0; }
    .payment-empty { font-style: italic; }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-won     { background: #dcfce7; color: #15803d; }
    .pill-lost    { background: #fee2e2; color: #dc2626; }
    .pill-pending { background: #fef3c7; color: #b45309; }
    .pill-open    { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    .drawer-loading {
      text-align: center;
      padding: 48px 20px;
      color: #94a3b8;
      font-size: 14px;
    }
    .drawer-spinner {
      width: 24px; height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    .drawer-load-more {
      display: block;
      margin: 14px 22px;
      width: calc(100% - 44px);
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #475569;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .drawer-load-more:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    /* ── States ── */
    .loading, .err-state {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
      font-size: 15px;
    }
    .err-state { color: #dc2626; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">TeleCRM — Affiliates</div>
    <a class="back" href="index.html">← Back</a>
  </div>

  <div class="page">
    <div class="loading" id="loading"><div class="spinner"></div>Loading your dashboard…</div>
    <div class="err-state" id="errState" style="display:none"></div>
    <div id="content" style="display:none">

      <!-- Profile -->
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="profile-info">
          <h1 id="name"></h1>
          <div class="sub" id="emailPhone"></div>
          <div class="badges" id="badges"></div>
        </div>
      </div>

      <!-- Commission -->
      <div class="section-label">Commission</div>
      <div class="stats-grid" id="commissionStats"></div>

      <!-- Lead funnel -->
      <div class="section-label">Lead Performance</div>
      <div class="content-card" id="funnelCard">
        <div class="content-card-header">
          <div class="content-card-title">Leads by Status</div>
        </div>
        <div id="funnel"></div>
      </div>

      <!-- Monthly Commission -->
      <div class="section-label">Monthly Commission</div>
      <div class="content-card">
        <div class="content-card-header">
          <div class="content-card-title">Commission Earned by Month</div>
        </div>
        <div id="commissionTable">
          <div class="comm-empty"><div class="drawer-spinner"></div>Loading…</div>
        </div>
      </div>

      <!-- Tenure -->
      <div class="section-label">Tenure</div>
      <div class="content-card">
        <div class="tenure-row" id="tenure"></div>
      </div>

      <!-- Bank details -->
      <div class="section-label">Bank Details</div>
      <div class="content-card">
        <div class="content-card-header">
          <div class="content-card-title">Payout Account</div>
          <button class="update-btn" title="Coming soon — Phase 3">Update Details</button>
        </div>
        <div class="bank-grid" id="bankFields"></div>
      </div>

    </div>
  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div>
        <div class="drawer-title" id="drawerTitle">Leads</div>
        <div class="drawer-sub"  id="drawerSub"></div>
      </div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.protocol === 'file:'
      ? 'https://affiliates-lac.vercel.app' : '';

    function fmtINR(n) {
      if (n == null) return '—';
      return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function tenure(iso) {
      if (!iso) return '';
      const days   = Math.floor((Date.now() - new Date(iso)) / 86400000);
      const yrs    = Math.floor(days / 365);
      const months = Math.floor((days % 365) / 30);
      if (yrs > 0) return `${yrs}y ${months}m`;
      if (months > 0) return `${months} months`;
      return `${days} days`;
    }
    // Parses free-text bank details. Affiliates' payment_details fields use
    // a few different shapes, e.g.:
    //   "Account Holder: PINTU MANDAL\nAccount Number: ...\nIFSC: ...\nBranch: ...\nAccount Type: ..."
    //   "Bank name -  ICICI bank\nAccount no –  ...\nAccount holder name - ...\nIFSC -  ..."
    //   "Name: Grow Medico\nIFSC Code: ...\nAccount No: ...\nBank: ..."
    //   "PAN No AAICB2409H\nAccount Holder Name\nBada Business Private Limited\n
    //    Bank Account Details\nHDFC- 50200037903577\nIFSC Code\nHDFC0001385"
    // The last shape puts a label on its own line with its value on the
    // following line (or, for "Bank Account Details", a "<bank code>- <a/c
    // no>" pair on the next line). Keys are normalised to lowercase and
    // looked up via aliases (see pick()).
    function parsePaymentDetails(raw) {
      if (!raw) return {};
      const r = {};
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

      // Lines that are *just* a field label, with the value on the line below
      // (e.g. "IFSC Code" \n "HDFC0001385").
      const EXACT_LABELS = [
        'account holder name', 'account holder', 'account name',
        'bank account details', 'bank account number', 'bank name', 'bank',
        'account number', 'account no', 'a/c number', 'a/c no',
        'ifsc code', 'ifsc', 'branch name', 'branch', 'account type',
      ];
      // Labels that appear inline with their value, space-separated, with no
      // ":"/"-" (e.g. "PAN No AAICB2409H").
      const INLINE_LABELS = ['pan number', 'pan no', 'pan'];

      for (let i = 0; i < lines.length; i++) {
        const line  = lines[i];
        const lower = line.toLowerCase();

        // 1. "Label: Value" / "Label - Value" on the same line.
        const sepIdx = line.search(/[:\-–]/);
        if (sepIdx > -1) {
          const k = line.slice(0, sepIdx).trim();
          const v = line.slice(sepIdx + 1).trim();
          if (k && v) { r[k.toLowerCase()] = v; continue; }
        }

        // 2. Inline "Label Value" with no separator (PAN-style).
        const inlineLabel = INLINE_LABELS.find(l => lower.startsWith(l + ' '));
        if (inlineLabel) {
          const v = line.slice(inlineLabel.length).trim();
          if (v) { r[inlineLabel] = v; continue; }
        }

        // 3. Standalone label line — value is the next line, unless that
        // line is itself a label (or another "Label: Value" pair).
        if (EXACT_LABELS.includes(lower) && i + 1 < lines.length) {
          const next      = lines[i + 1];
          const nextLower = next.toLowerCase();
          const nextIsLabel = EXACT_LABELS.includes(nextLower)
            || INLINE_LABELS.some(l => nextLower === l || nextLower.startsWith(l + ' '));
          if (!nextIsLabel && next.search(/[:\-–]/) === -1) {
            r[lower] = next;
            i++;
          }
        }
      }

      return r;
    }
    // Looks up the first matching alias (case-insensitive) in a parsed
    // payment-details map, returning null if none are present.
    function pick(parsed, ...keys) {
      for (const k of keys) {
        const v = parsed[k.toLowerCase()];
        if (v) return v;
      }
      return null;
    }
    // IFSC prefixes (first 4 chars) → bank display name. Used to derive
    // "Bank Name" when it isn't given as an explicit label, either from the
    // IFSC code itself or from a "<bank code>- <account no>" pair (see
    // parsePaymentDetails's "Bank Account Details" handling above).
    const BANK_CODES = {
      HDFC: 'HDFC Bank', ICIC: 'ICICI Bank', SBIN: 'State Bank of India',
      PUNB: 'Punjab National Bank', UTIB: 'Axis Bank', KKBK: 'Kotak Mahindra Bank',
      YESB: 'Yes Bank', CNRB: 'Canara Bank', BARB: 'Bank of Baroda',
      IDFB: 'IDFC First Bank', INDB: 'IndusInd Bank', IOBA: 'Indian Overseas Bank',
      UBIN: 'Union Bank of India', BKID: 'Bank of India', MAHB: 'Bank of Maharashtra',
      PSIB: 'Punjab & Sind Bank', UCBA: 'UCO Bank', FDRL: 'Federal Bank',
      RATN: 'RBL Bank', SIBL: 'South Indian Bank', BDBL: 'Bandhan Bank',
    };

    async function load() {
      const email = new URLSearchParams(window.location.search).get('email');
      if (!email) { showError('No email provided. <a href="index.html" style="color:#2563eb">Go back</a>.'); return; }
      try {
        const res = await fetch(`${API_BASE}/api/metrics?email=${encodeURIComponent(email)}`);
        if (!res.ok) { const b = await res.json().catch(()=>({})); showError(b.error || `Error ${res.status}`); return; }
        render(await res.json());
      } catch (e) { showError('Could not reach the server. Please try again.'); }
    }

    function render(d) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.title = `${d.name || 'Dashboard'} — TeleCRM Affiliates`;

      document.getElementById('avatar').textContent = (d.name || '?')[0].toUpperCase();
      document.getElementById('name').textContent = d.name || d.email;
      document.getElementById('emailPhone').textContent =
        [d.email, d.phone ? `+${d.phone}` : null].filter(Boolean).join(' · ');

      const badgeMap = [
        d.status       && { label: d.status,       cls: 'badge-green' },
        d.kyc_status   && { label: d.kyc_status,   cls: d.kyc_status === 'KYC Done' ? 'badge-blue' : 'badge-amber' },
        d.affiliate_type && { label: d.affiliate_type, cls: 'badge-gray' },
      ].filter(Boolean);
      document.getElementById('badges').innerHTML = badgeMap.map(b =>
        `<span class="badge ${b.cls}">${b.label}</span>`).join('');

      // Commission
      const c = d.commission || {};
      document.getElementById('commissionStats').innerHTML = [
        { label: 'Total Earned',    value: fmtINR(c.earned),   sub: 'lifetime',             cls: 'sc-green' },
        { label: 'Pending Payout',  value: fmtINR(c.pending),  sub: 'awaiting disbursement', cls: 'sc-amber' },
        { label: 'Commission Rate', value: c.percentage != null ? `${c.percentage}%` : '—', sub: d.affiliate_type || '', cls: 'sc-blue' },
      ].map(s => `
        <div class="stat-card ${s.cls}">
          <div class="sc-label">${s.label}</div>
          <div class="sc-value">${s.value}</div>
          <div class="sc-sub">${s.sub}</div>
        </div>`).join('');

      // Funnel
      const l    = d.leads || {};
      const tot  = l.total || 1;
      const bd   = l.breakdown || {};
      const FUNNEL_COLORS = {
        'Total Assigned':  { bar: '#2563eb', text: '#2563eb' },
        'Won':             { bar: '#16a34a', text: '#16a34a' },
        'Payment Pending': { bar: '#d97706', text: '#d97706' },
        'Lost':            { bar: '#dc2626', text: '#dc2626' },
        'Open':            { bar: '#94a3b8', text: '#475569' },
      };
      const rows = [
        { label: 'Total Assigned',  count: l.total,              status: null,              pct: 100 },
        { label: 'Won',             count: bd.Won,               status: 'Won',             pct: ((bd.Won||0)/tot)*100 },
        { label: 'Payment Pending', count: bd['Payment Pending'],status: 'Payment Pending', pct: ((bd['Payment Pending']||0)/tot)*100 },
        { label: 'Lost',            count: bd.Lost,              status: 'Lost',            pct: ((bd.Lost||0)/tot)*100 },
        { label: 'Open',            count: l.open,               status: '__open__',        pct: ((l.open||0)/tot)*100 },
      ].filter(r => r.count);

      document.getElementById('funnel').innerHTML = rows.map(r => {
        const col = FUNNEL_COLORS[r.label] || { bar: '#94a3b8', text: '#475569' };
        return `
          <div class="funnel-row" data-status="${r.status??''}" data-label="${r.label}" data-barcolor="${col.bar}" data-textcolor="${col.text}">
            <div class="funnel-label">${r.label}</div>
            <div class="funnel-bar-wrap">
              <div class="funnel-bar" style="width:${r.pct.toFixed(1)}%;background:${col.bar}"></div>
            </div>
            <div class="funnel-count" style="color:${col.text}">${r.count ?? '—'}</div>
            <div class="funnel-arrow">›</div>
          </div>`;
      }).join('');

      drawerEmail = d.email;
      drawerName  = d.name;
      document.querySelectorAll('.funnel-row').forEach(row => {
        row.addEventListener('click', () =>
          openDrawer(row.dataset.label, row.dataset.status || null, row.dataset.barcolor, row.dataset.textcolor));
      });

      // Monthly commission
      loadCommission(d.email, d.name);

      // Tenure
      const since = d.member_since;
      document.getElementById('tenure').innerHTML = `
        <div class="tenure-item">
          <div class="t-label">Partner Since</div>
          <div class="t-value">${fmtDate(since)}</div>
          <div class="t-sub">${tenure(since) ? tenure(since) + ' ago' : ''}</div>
        </div>
        <div class="tenure-item">
          <div class="t-label">Last Updated</div>
          <div class="t-value">${fmtDate(d.last_updated)}</div>
        </div>`;

      // Bank details
      const bank   = d.bank || {};
      const parsed = parsePaymentDetails(bank.payment_details);

      let ifscCode      = pick(parsed, 'IFSC', 'IFSC Code') || bank.ifsc_code || null;
      let bankName      = pick(parsed, 'Bank Name', 'Bank');
      let accountNumber = pick(parsed, 'Account Number', 'Account No', 'Account no');

      // Fallback: an unrecognised "<label> - <value>" pair where the value
      // is a long digit string is very likely "<bank code> - <account no>"
      // (e.g. "HDFC- 50200037903577") — use it for Account Number, and the
      // leftover label (a bank code) for Bank Name if we don't have one.
      if (!accountNumber || !bankName) {
        for (const [k, v] of Object.entries(parsed)) {
          if (/^\d{9,18}$/.test(v)) {
            if (!accountNumber) accountNumber = v;
            if (!bankName && BANK_CODES[k.toUpperCase()]) bankName = BANK_CODES[k.toUpperCase()];
            break;
          }
        }
      }
      // Fallback: derive the bank name from the IFSC code's bank prefix.
      if (!bankName && ifscCode) {
        bankName = BANK_CODES[ifscCode.slice(0, 4).toUpperCase()] || null;
      }

      const bFields = [
        { label: 'Account Name',   value: pick(parsed, 'Account Holder', 'Account holder name', 'Account Name', 'Name') },
        { label: 'Bank Name',      value: bankName },
        { label: 'Account Number', value: accountNumber },
        { label: 'IFSC Code',      value: ifscCode },
        { label: 'Branch',         value: pick(parsed, 'Branch', 'Branch Name') },
        { label: 'Account Type',   value: pick(parsed, 'Account Type', 'Type') },
      ];
      document.getElementById('bankFields').innerHTML = bFields.map(f => `
        <div class="bank-field">
          <div class="bf-label">${f.label}</div>
          <div class="bf-value ${f.value?'':'empty'}">${f.value || 'Not provided'}</div>
        </div>`).join('');
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('errState');
      el.innerHTML = msg; el.style.display = 'block';
    }

    // ── Monthly commission ──────────────────────────────────────────────────
    function fmtMonth(ym) {
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    }
    async function loadCommission(email, name) {
      const el = document.getElementById('commissionTable');
      try {
        const qs  = new URLSearchParams({ email, name: name || '' });
        const res = await fetch(`${API_BASE}/api/commission?${qs}`);
        const data = await res.json();
        if (!res.ok) {
          el.innerHTML = `<div class="comm-empty">${data.error || 'Failed to load commission data.'}</div>`;
          return;
        }
        if (!data.monthly || !data.monthly.length) {
          el.innerHTML = `<div class="comm-empty">No commission recorded yet.</div>`;
          return;
        }
        const rows = data.monthly.map(m => `
          <div class="comm-row">
            <div class="comm-month">${fmtMonth(m.month)}</div>
            <div class="comm-amount">${fmtINR(m.total_commission)}</div>
          </div>`).join('');
        const total = `
          <div class="comm-row total">
            <div class="comm-month">Total</div>
            <div class="comm-amount">${fmtINR(data.total_commission)}</div>
          </div>`;
        el.innerHTML = rows + total;
      } catch (e) {
        el.innerHTML = `<div class="comm-empty">Could not load commission data.</div>`;
      }
    }

    // ── Drawer ───────────────────────────────────────────────────────────────
    const STATUS_PILL_CLASS = { 'Won': 'pill-won', 'Lost': 'pill-lost', 'Payment Pending': 'pill-pending' };
    function pillClass(s) { return STATUS_PILL_CLASS[s] || 'pill-open'; }

    function buildLeadRow(l) {
      return `
        <div class="lead-row" data-id="${l.id}">
          <div class="lead-item" onclick="toggleLead('${l.id}')">
            <span class="lead-chevron">&#8250;</span>
            <div class="lead-main">
              <div class="lead-name">${l.name}</div>
              ${l.email ? `<div class="lead-email">${l.email}</div>` : ''}
            </div>
            <span class="status-pill ${pillClass(l.status)}">${l.status || 'Unknown'}</span>
          </div>
          <div class="lead-expand" id="expand-${l.id}"></div>
        </div>`;
    }

    // Per-lead payment details, fetched lazily on first expand
    const leadDetailCache = {};
    async function toggleLead(id) {
      const row    = document.querySelector(`.lead-row[data-id="${id}"]`);
      const expand = document.getElementById(`expand-${id}`);
      if (!row || !expand) return;

      if (row.classList.contains('expanded')) {
        row.classList.remove('expanded');
        return;
      }
      row.classList.add('expanded');

      if (leadDetailCache[id]) {
        expand.innerHTML = renderPayments(leadDetailCache[id]);
        return;
      }
      expand.innerHTML = `<div class="payment-loading">Loading payment details…</div>`;
      try {
        const res  = await fetch(`${API_BASE}/api/lead-detail?id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (!res.ok) {
          expand.innerHTML = `<div class="payment-empty">${data.error || 'Failed to load details.'}</div>`;
          return;
        }
        leadDetailCache[id] = data.payments || [];
        expand.innerHTML = renderPayments(leadDetailCache[id]);
      } catch (e) {
        expand.innerHTML = `<div class="payment-empty">Could not load payment details.</div>`;
      }
    }

    function renderPayments(payments) {
      if (!payments.length) return `<div class="payment-empty">No payment details recorded for this lead yet.</div>`;
      return payments.map(p => `
        <div class="payment-card">
          <div class="payment-date">${fmtDate(p.date)}</div>
          <div class="payment-grid">
            ${p.amount            != null ? `<div><span class="pg-label">Amount</span><span class="pg-value">${fmtINR(p.amount)}</span></div>` : ''}
            ${p.licenses          != null ? `<div><span class="pg-label">Licenses</span><span class="pg-value">${p.licenses}</span></div>` : ''}
            ${p.discount          != null ? `<div><span class="pg-label">Discount</span><span class="pg-value">${p.discount}</span></div>` : ''}
            ${p.commission_amount != null ? `<div><span class="pg-label">Commission</span><span class="pg-value">${fmtINR(p.commission_amount)}${p.commission_pct ? ` (${p.commission_pct})` : ''}</span></div>` : ''}
          </div>
        </div>`).join('');
    }

    let drawerEmail = null, drawerName = null, drawerSkip = 0, drawerStatus = null, drawerTotal = 0;

    function openDrawer(label, status, barColor, textColor) {
      drawerStatus = (status === '__open__') ? null : status;
      drawerSkip   = 0; drawerTotal = 0;
      document.getElementById('drawerTitle').textContent  = label;
      document.getElementById('drawerTitle').style.color  = textColor || '#0f172a';
      document.getElementById('drawerSub').textContent    = '';
      document.getElementById('drawerBody').innerHTML     = `<div class="drawer-loading"><div class="drawer-spinner"></div>Loading…</div>`;
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('open');
      fetchLeads(true);
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }
    async function fetchLeads(fresh = false) {
      if (fresh) drawerSkip = 0;
      const qs = new URLSearchParams({ email: drawerEmail, name: drawerName, skip: drawerSkip, limit: 50 });
      if (drawerStatus) qs.set('status', drawerStatus);
      const res  = await fetch(`${API_BASE}/api/leads?${qs}`);
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('drawerBody').innerHTML = `<div class="drawer-loading" style="color:#dc2626">${data.error||'Failed to load'}</div>`;
        return;
      }
      drawerTotal = data.total_count;
      document.getElementById('drawerSub').textContent = `${drawerTotal} lead${drawerTotal !== 1 ? 's' : ''}`;
      const items = data.leads.map(buildLeadRow).join('');
      if (fresh) {
        document.getElementById('drawerBody').innerHTML = items || `<div class="drawer-loading">No leads found.</div>`;
      } else {
        document.getElementById('loadMoreBtn')?.remove();
        document.getElementById('drawerBody').insertAdjacentHTML('beforeend', items);
      }
      drawerSkip += data.leads.length;
      if (drawerSkip < drawerTotal) {
        document.getElementById('drawerBody').insertAdjacentHTML('beforeend',
          `<button class="drawer-load-more" id="loadMoreBtn" onclick="fetchLeads(false)">
            Load more (${drawerTotal - drawerSkip} remaining)
          </button>`);
      }
    }
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

    load();
  </script>
</body>
</html>
