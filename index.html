<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleCRM Affiliates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="email"]:focus {
      border-color: #38bdf8;
    }

    input[type="email"]::placeholder { color: #475569; }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #7dd3fc; }

    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: #450a0a;
      border: 1px solid #991b1b;
      border-radius: 8px;
      font-size: 13px;
      color: #fca5a5;
    }

    .hint {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #1e3a5f;
      font-size: 12px;
      color: #475569;
      text-align: center;
    }

    .hint code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TeleCRM &mdash; Affiliates</div>
    <h1>View Your Activity</h1>
    <p class="subtitle">Enter your registered email to see your leads, deals, and commission history.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit">View My Activity &rarr;</button>
      <div class="error" id="error">Please enter a valid email address.</div>
    </form>

    <div class="hint">
      Try: <code>test@example.com</code> or <code>demo@telecrm.in</code>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const err   = document.getElementById('error');

      if (!email || !email.includes('@')) {
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      window.location.href = 'activity.html?email=' + encodeURIComponent(email);
    });
  </script>
</body>
</html>
