<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleCRM Affiliates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f1f5f9;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* ── Dark top strip ── */
    .topbar {
      background: #0f172a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
    }
    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
    }

    /* ── Centered card area ── */
    .page {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.10);
      border: 1px solid #e2e8f0;
    }

    .card-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #2563eb;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    input[type="email"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    input[type="email"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
      background: #fff;
    }
    input[type="email"]::placeholder { color: #94a3b8; }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 13px;
      color: #dc2626;
    }

    .hint {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .hint code {
      background: #f1f5f9;
      padding: 2px 7px;
      border-radius: 4px;
      color: #475569;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">TeleCRM &mdash; Affiliates</div>
  </div>

  <div class="page">
    <div class="card">
      <div class="card-eyebrow">Affiliate Portal</div>
      <h1>View Your Dashboard</h1>
      <p class="subtitle">Enter your registered email to see your leads, commissions, and performance.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit">Open Dashboard &rarr;</button>
        <div class="error" id="error">Please enter a valid email address.</div>
      </form>

      <div class="hint">
        Try: <code>saurabh@growmedico.com</code>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const err   = document.getElementById('error');

      if (!email || !email.includes('@')) {
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      window.location.href = 'metrics.html?email=' + encodeURIComponent(email);
    });
  </script>
</body>
</html>
