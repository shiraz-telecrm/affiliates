<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — TeleCRM Affiliates</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f1f5f9;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .topbar {
      background: #0f172a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
    }
    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
    }

    .page {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.10);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .card-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #2563eb;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .g-signin-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 13px;
      color: #dc2626;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">TeleCRM &mdash; Affiliates</div>
  </div>

  <div class="page">
    <div class="card">
      <div class="card-eyebrow">Restricted Access</div>
      <h1>Sign in to continue</h1>
      <p class="subtitle">This dashboard is restricted to authorized TeleCRM accounts.</p>

      <div class="g-signin-wrap" id="g_id_signin"></div>
      <div class="error" id="error"></div>
    </div>
  </div>

  <script>
    // Public OAuth client ID — safe to embed in frontend code.
    const GOOGLE_CLIENT_ID = 'REPLACE_WITH_GOOGLE_CLIENT_ID.apps.googleusercontent.com';

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function handleCredentialResponse(response) {
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      })
        .then(async r => ({ ok: r.ok, data: await r.json() }))
        .then(({ ok, data }) => {
          if (!ok) {
            showError(data.error || 'Sign-in failed.');
            return;
          }
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
          window.location.href = redirect;
        })
        .catch(() => showError('Could not reach the server. Please try again.'));
    }

    window.addEventListener('load', function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(
        document.getElementById('g_id_signin'),
        { theme: 'outline', size: 'large', width: 320 }
      );
    });
  </script>
</body>
</html>
